# Tests on GitHub runners, with no API key, no secrets, no network and no rag-service.
#
# WHAT CI PROVES HERE, AND WHAT IT DOES NOT. Every tool is called through the MCP layer
# (`mcp.Client` against the server object, in-process), and every exchange with rag-service
# goes through an `httpx.MockTransport` built from responses recorded from the real service.
# That covers the four outcomes that must never look alike — hits, nothing matched, empty
# index, service down — plus the guards. tests/conftest.py blocks outbound TCP, so "no
# network" is enforced on the runner rather than trusted. What CI cannot do is run
# rag-service (a different repo, with a model and a vector store) or a live agent session:
# those are checked on a developer's machine, and the README quotes their real output.
#
# NO SECRETS, ON PURPOSE. There is no key in this repo to hide: the server generates nothing,
# and the agent writes the answer. A step that needed a secret would be a design change.
#
# WHY ONLY TWO PYTHON VERSIONS: the same reason as rag-service and rag-eval. The value of the
# badge is that it is green, and every extra interpreter is another chance of a red caused by
# someone else's packaging. The README claims 3.11 and 3.12 because that is what runs here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one version failing should not hide the other's result
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # Bare `pytest`, as the README says — pytest.ini sets `pythonpath = .` so it imports
        # the package without `python -m`.
        run: pytest
