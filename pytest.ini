[pytest]
# WHY THIS FILE EXISTS: without `pythonpath`, bare `pytest` fails with "No module named
# 'agent_tools_mcp'" while `python -m pytest` works — the second form puts the current
# directory on sys.path and the first does not. The README will say `pytest`, a reviewer will
# run `pytest`, and a healthy repo would look broken. rag-service lost an evening to this.
pythonpath = .

testpaths = tests
addopts = -q
